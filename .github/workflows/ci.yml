name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: pm3 cargo check
        working-directory: ./pm3
        run: cargo check

      - name: Shared instance resolution tests
        run: cargo test --manifest-path pm3-runtime/Cargo.toml

      - name: CLI tests
        run: cargo test --manifest-path pm3/Cargo.toml

      - name: Installer syntax and lifecycle tests
        run: |
          sh -n install.sh
          sudo sh tests/install-system.sh

      - name: pm3-daemon cargo check
        working-directory: ./pm3-daemon
        run: cargo check

      - name: pm3-daemon cargo test
        working-directory: ./pm3-daemon
        run: cargo test

      - name: Linux daemon lifecycle
        run: |
          cargo build --manifest-path pm3/Cargo.toml
          cargo build --manifest-path pm3-daemon/Cargo.toml
          sh tests/linux-instances.sh
          sudo env PM3_TEST_CLI="$PWD/pm3/target/debug/pm3" PM3_TEST_DAEMON="$PWD/pm3-daemon/target/debug/pm3-daemon" sh tests/systemd-lifecycle.sh
