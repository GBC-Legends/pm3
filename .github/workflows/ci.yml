name: CI

on:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: pm3 cargo check
        working-directory: ./pm3
        run: cargo check

      - name: pm3-daemon cargo check
        working-directory: ./pm3-daemon
        run: cargo check

      - name: pm3-daemon cargo test
        working-directory: ./pm3-daemon
        run: cargo test
